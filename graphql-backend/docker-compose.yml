services:
  graphql-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bowling-graphql
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_PORT: ${APP_PORT}
    volumes:
      - bowling-data:/data
    restart: unless-stopped

volumes:
  bowling-data:
